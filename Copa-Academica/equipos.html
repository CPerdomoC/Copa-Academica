<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos | Copa Académica</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header class="header">
        <div class="container header-flex">
            <div class="header-left"><span>Copa Académica</span></div>
            <div class="header-center"><div class="logo-container"><img src="Assets/trofeo-1.png" alt="Logo"></div></div>
            <nav class="nav-container">
                <a href="index.html">Inicio</a>
                <a href="equipos.html">Equipos</a>
                <a href="calendario.html">Calendario</a>
                <a href="carrera.html">Modo Carrera</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="titulo-seccion" style="margin-top: 40px;">Clubes Oficiales</h2>
        <div id="grid-equipos" class="equipos-grid"></div>
    </main>

    <script src="funciones.js"></script>
        <script>
            const grid = document.getElementById('grid-equipos');
            
            nombresEquiposBase.forEach(nombre => {
                const nombreArchivo = obtenerNombreEscudo(nombre);
                const pais = origenesEquipos[nombre] || "espana";
                const descripcion = historiasEquipos[nombre] || `La historia de ${nombre} está por escribirse...`;

                grid.innerHTML += `
                    <div class="equipo-card">
                        <div class="card-header">
                            <div class="bandera-fondo" style="background-image: url('Assets/${pais}.png')">
                                <div class="escudo-protector">
                                    <img src="Assets/${nombreArchivo}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5323/5323982.png'">
                                </div>
                            </div>
                            <h3>${nombre}</h3>
                        </div>
                        <div class="card-body">
                            <p contenteditable="true" class="editable-text">
                                ${descripcion}
                            </p>
                        </div>
                    </div>
                `;
            });
        </script>
</body>
</html>
