<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Carrera | Copa Académica</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header class="header">
        <div class="container header-flex">
            <div class="header-left"><span>Copa Académica</span></div>
            <div class="header-center"><div class="logo-container"><img src="Assets/trofeo-1.png" alt="Logo"></div></div>
            <nav class="nav-container">
                <a href="index.html">Inicio</a>
                <a href="equipos.html">Equipos</a>
                <a href="calendario.html">Calendario</a>
                <a href="carrera.html">Modo Carrera</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="setup-section" class="setup-container">
            <h2 class="titulo-seccion">Inscripción de Jugadores</h2>
            <div class="input-group" style="margin-bottom: 20px;">
                <label>¿Cuántos amigos participáis?</label>
                <input type="number" id="num-jugadores" min="1" max="20" value="1" onchange="dibujarFormulario()">
            </div>
            <div id="formulario-jugadores"></div>
            <button class="btn-simular" style="width: 100%; margin-top: 20px;" onclick="validarEIniciar()">Confirmar e Iniciar Liga</button>
        </section>

        <section id="game-section" class="hidden">
            <div class="seccion-encabezado-flex">
                <h2 id="display-jornada" class="titulo-seccion">Jornada 0</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-simular" style="background:#ef4444" onclick="location.reload()">Reset</button>
                    <button id="btn-jornada" class="btn-simular" onclick="simularSiguienteJornada()">Simular Jornada</button>
                </div>
            </div>

            <div class="game-layout">
                <div class="tabla-container">
                    <div class="tabla-header-full"><span>#</span><span>Equipo</span><span>PJ</span><span>G</span><span>E</span><span>P</span><span>Pts</span></div>
                    <ul class="lista-equipos" id="tabla-carrera"></ul>
                </div>
                <aside class="tabla-container" style="padding: 15px;">
                    <h3 style="color: #17226B; border-bottom: 2px solid #FFD600; padding-bottom: 5px;">Pichichi</h3>
                    <ul id="lista-goleadores" class="goleadores-list"></ul>
                </aside>
            </div>

            <div id="panel-resultados" class="resultados-jornada hidden">
                <h3 style="color: #17226B; text-align: center; margin-bottom: 20px; font-weight: bold;">ACTA OFICIAL - JORNADA <span id="num-acta"></span></h3>
                <div id="lista-partidos-detallados"></div>
            </div>
        </section>
    </main>

    <script src="funciones.js"></script>
    <script>
        // Iniciamos solo la lógica de carrera al cargar
        window.onload = inicializarCarrera;
    </script>
</body>
</html>
